name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APKs
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "AdShield-${TAG}.apk"
          # Stable filename so the website's download link never goes stale.
          cp app/build/outputs/apk/debug/app-debug.apk "AdShield.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AdShield ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## AdShield ${{ github.event.inputs.tag || github.ref_name }}

            A no-root, on-device ad & tracker blocker for Android.

            ### Install
            1. Download **AdShield-${{ github.event.inputs.tag || github.ref_name }}.apk** below.
            2. Copy it to your Android phone and open it to install
               (allow "install from unknown sources" if prompted).
            3. Launch AdShield, flip the switch, and approve the VPN consent dialog.

            ### Notes
            - Uses a local, server-less VPN that filters DNS — no traffic leaves
              your phone through a server.
            - Can't block ads served from an app's own domain (e.g. some YouTube ads).
            - Not on Google Play (ad blockers are disallowed there) — sideload only.
          files: |
            AdShield-*.apk
            AdShield.apk
          draft: false
          prerelease: false
